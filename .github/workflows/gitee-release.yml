name: Mirror release packages to Gitee
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published GitHub tag to mirror (for example v0.8.0)
        required: true
        type: string
      initialize_guides:
        description: Replace Gitee README.md/README.en.md with download guides (first setup only)
        required: false
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: gitee-release-mirror
  cancel-in-progress: false
jobs:
  mirror:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # 工具取主分支；包按事件标签选择，允许补同步旧版。 / Use the main-branch tool; select packages by tag to allow backfills.
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test release mirroring
        run: python3 -m unittest discover -s tests/tools -p test_sync_gitee_release.py -v
      - name: Verify and mirror published packages
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          GH_TOKEN: ${{ github.token }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          INITIALIZE_GUIDES: ${{ inputs.initialize_guides }}
        run: |
          args=()
          if [[ "$INITIALIZE_GUIDES" == "true" ]]; then args+=(--initialize-guides); fi
          python3 tools/sync_gitee_release.py --tag "$RELEASE_TAG" --apply "${args[@]}" --report build-dev/gitee-mirror.json
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: gitee-mirror-verification
          path: build-dev/gitee-mirror.json
