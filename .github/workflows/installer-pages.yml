name: Web installer (GitHub Pages)
on:
  push:
    branches: [codex/reader-foundation]
    paths: [installer/**, releases/**, tools/installer_site.py, tests/installer/**, .github/workflows/installer-pages.yml]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: installer-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: node --test tests/installer/plan.test.mjs
      - run: python3 tools/installer_site.py --out build-installer
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build-installer
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
