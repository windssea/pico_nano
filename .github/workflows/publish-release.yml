name: Publish GitHub Release and mirror to Gitee
on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: Canonical release tag to publish (for example v1.1.1)
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: release-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Resolve and validate canonical tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$EVENT_NAME" == "push" ]]; then
            tag="$REF_NAME"
          else
            tag="$INPUT_TAG"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Skipping non-canonical tag: $tag"
            exit 1
          fi
          echo "value=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref || 'main' }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install OTA signature verifier
        run: python3 -m pip install -r tools/requirements-ota.txt
      - name: Test release publisher and mirror verifier
        run: |
          python3 -m unittest discover -s tests/tools -p 'test_publish_github_release.py' -v
          python3 -m unittest discover -s tests/tools -p 'test_sync_gitee_release.py' -v
      - name: Verify bundle and publish GitHub Release
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.value }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/publish_github_release.py --tag "$RELEASE_TAG" --repo "${{ github.repository }}" --apply
      - name: Mirror published release to Gitee
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.value }}
          GH_TOKEN: ${{ github.token }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          if [[ -z "$GITEE_TOKEN" ]]; then
            echo "GITEE_TOKEN secret is not set; skipping Gitee mirror."
            exit 0
          fi
          for attempt in 1 2 3; do
            if python3 tools/sync_gitee_release.py --tag "$RELEASE_TAG" --apply --wait-for-assets 180 --report build-dev/gitee-mirror.json; then
              exit 0
            fi
            if [[ "$attempt" == 3 ]]; then exit 1; fi
            echo "Rechecking existing attachments before the next bounded sync attempt"
            sleep 15
          done
      - uses: actions/upload-artifact@v4
        if: success() && hashFiles('build-dev/gitee-mirror.json') != ''
        with:
          name: gitee-mirror-verification
          path: build-dev/gitee-mirror.json
