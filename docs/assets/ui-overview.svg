    <g font-size="44">
      <text x="120" y="189" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#161616">窗外的风渐渐停了。桌上</text>
      <text x="32" y="253" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#161616">放着一本翻到一半的书，纸页</text>
      <text x="32" y="317" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#161616">之间，留着昨天读到的地方。</text>
      <text x="120" y="408" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#161616">阅读不必匆忙。字与字之</text>
      <text x="32" y="472" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#161616">间，留出恰好的距离；段落与</text>
      <text x="32" y="536" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#161616">段落之间，也有片刻的呼吸。</text>
      <text x="120" y="627" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#161616">轻轻按下右侧的按键，下</text>
      <text x="32" y="691" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#161616">一页便来到眼前。故事继续，</text>
      <text x="32" y="755" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#161616">屏幕之外仍然安静。</text>
      <text x="120" y="846" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#161616">把喜欢的一页留作书签，</text>
      <text x="32" y="910" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#161616">下次醒来，就从这里接着读。</text>
    </g>
