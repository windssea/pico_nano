<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PicoNano · 接收确认</title>
<style>body{font:16px/1.6 system-ui,sans-serif;background:#f4f4f2;color:#222;margin:0}main{max-width:680px;margin:36px auto;padding:24px}h1{font-size:30px;margin:8px 0}small{color:#666}article{background:white;border:1px solid #ddd;border-radius:14px;padding:18px;margin:12px 0;overflow-wrap:anywhere}select,button{font:inherit;padding:12px;border:1px solid #bbb;border-radius:10px;background:white}button{cursor:pointer}button.primary{background:#222;color:white}button:disabled{opacity:.4;cursor:default}progress{width:100%;height:18px}#actions{display:flex;gap:12px;flex-wrap:wrap}#message{min-height:28px;color:#555}</style>
<main><small>PicoNano · 本机接收控制</small><h1>附近传书</h1><p id="phase">正在连接</p><p id="sender"></p><section id="files"></section><article><strong id="file"></strong><progress id="progress" value="0" max="100"></progress><p id="counts"></p><small>收到字节不代表已保存。图片只安装到指定目录，不自动切换封面或壁纸。</small></article><div id="actions"><button id="reject">拒绝全部</button><button class="primary" id="accept">确认接收</button><button id="cancel">取消接收</button></div><p id="message"></p><small>这是 PC 本机控制工具；设备界面与官方客户端完整互通仍待验收。</small></main><script src="/control.js"></script></html>
